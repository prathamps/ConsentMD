<IfModule mod_ssl.c>

# Root domain - consentmd.online (redirects to Netlify)
<VirtualHost *:80>
    ServerName consentmd.online
    ServerAlias www.consentmd.online
    Redirect permanent / https://consentmd-frontend.netlify.app/
</VirtualHost>

<VirtualHost *:443>
    ServerName consentmd.online
    ServerAdmin webmaster@localhost
    
    # Redirect to your Netlify domain
    Redirect permanent / https://consentmd-frontend.netlify.app/
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/consentmd.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/consentmd.online/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    ErrorLog ${APACHE_LOG_DIR}/main_consentmd_error.log
    CustomLog ${APACHE_LOG_DIR}/main_consentmd_access.log combined
</VirtualHost>

# WWW redirect - redirect www to non-www
<VirtualHost *:443>
    ServerName www.consentmd.online
    ServerAdmin webmaster@localhost
    
    # Redirect www to non-www (which has valid SSL)
    Redirect permanent / https://consentmd.online/
    
    # Use the same SSL certificate (this will show as insecure, but redirect immediately)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/consentmd.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/consentmd.online/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    ErrorLog ${APACHE_LOG_DIR}/www_consentmd_error.log
    CustomLog ${APACHE_LOG_DIR}/www_consentmd_access.log combined
</VirtualHost>

# API endpoint - api.consentmd.online
<VirtualHost *:80>
    ServerName api.consentmd.online
    Redirect permanent / https://api.consentmd.online/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.consentmd.online
    ServerAdmin webmaster@localhost
    
    # Enable SSL
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/consentmd.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/consentmd.online/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    # Proxy configuration
    ProxyPreserveHost On
    ProxyPass / http://40.114.45.2:3000/
    ProxyPassReverse / http://40.114.45.2:3000/
    
    ErrorLog ${APACHE_LOG_DIR}/api_consentmd_error.log
    CustomLog ${APACHE_LOG_DIR}/api_consentmd_access.log combined
</VirtualHost>

