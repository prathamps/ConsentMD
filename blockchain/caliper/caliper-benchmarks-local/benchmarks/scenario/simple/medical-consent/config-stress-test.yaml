test:
  name: medical-consent-stress-test-benchmark
  description: Stress test benchmark with progressive load increase and failure detection
  workers:
    type: local
    number: 12
  rounds:
    # Phase 1: Baseline stress - moderate load
    - label: stress-phase1-registerDoctorProfile
      description: Stress Phase 1 - Register doctor profiles
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 80
      workload:
        module: benchmarks/scenario/simple/medical-consent/registerDoctorProfile.js
        arguments: {}

    - label: stress-phase1-createPatientRecord
      description: Stress Phase 1 - Create patient records
      txNumber: 600
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: benchmarks/scenario/simple/medical-consent/createPatientRecord.js
        arguments: {}

    - label: stress-phase1-getRecordById
      description: Stress Phase 1 - Get records by ID
      txNumber: 800
      rateControl:
        type: fixed-rate
        opts:
          tps: 120
      workload:
        module: benchmarks/scenario/simple/medical-consent/getRecordById.js
        arguments: {}

    # Phase 2: High stress - increased load
    - label: stress-phase2-createMedicalRecord
      description: Stress Phase 2 - Create medical records
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 150
      workload:
        module: benchmarks/scenario/simple/medical-consent/createMedicalRecord.js
        arguments: {}

    - label: stress-phase2-grantConsent
      description: Stress Phase 2 - Grant consent operations
      txNumber: 800
      rateControl:
        type: fixed-rate
        opts:
          tps: 130
      workload:
        module: benchmarks/scenario/simple/medical-consent/grantConsent.js
        arguments: {}

    - label: stress-phase2-findAssetsByQuery
      description: Stress Phase 2 - Find assets by query
      txNumber: 1200
      rateControl:
        type: fixed-rate
        opts:
          tps: 160
      workload:
        module: benchmarks/scenario/simple/medical-consent/findAssetsByQuery.js
        arguments: {}

    # Phase 3: Maximum stress - pushing limits
    - label: stress-phase3-updateRecordDetails
      description: Stress Phase 3 - Update record details
      txNumber: 1500
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: benchmarks/scenario/simple/medical-consent/updateRecordDetails.js
        arguments: {}

    - label: stress-phase3-getAssetHistory
      description: Stress Phase 3 - Get asset history
      txNumber: 1800
      rateControl:
        type: fixed-rate
        opts:
          tps: 220
      workload:
        module: benchmarks/scenario/simple/medical-consent/getAssetHistory.js
        arguments: {}

    - label: stress-phase3-assetExistsByQuery
      description: Stress Phase 3 - Check asset existence
      txNumber: 2000
      rateControl:
        type: fixed-rate
        opts:
          tps: 250
      workload:
        module: benchmarks/scenario/simple/medical-consent/assetExistsByQuery.js
        arguments: {}

    # Phase 4: Extreme stress - failure detection
    - label: stress-phase4-addPrivateNoteToRecord
      description: Stress Phase 4 - Add private notes (extreme load)
      txNumber: 1200
      rateControl:
        type: fixed-rate
        opts:
          tps: 300
      workload:
        module: benchmarks/scenario/simple/medical-consent/addPrivateNoteToRecord.js
        arguments: {}

    - label: stress-phase4-revokeConsent
      description: Stress Phase 4 - Revoke consent (extreme load)
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 280
      workload:
        module: benchmarks/scenario/simple/medical-consent/revokeConsent.js
        arguments: {}

    - label: stress-phase4-archiveMedicalRecord
      description: Stress Phase 4 - Archive records (extreme load)
      txNumber: 800
      rateControl:
        type: fixed-rate
        opts:
          tps: 260
      workload:
        module: benchmarks/scenario/simple/medical-consent/archiveMedicalRecord.js
        arguments: {}

    # Phase 5: Recovery test - reduced load after stress
    - label: stress-recovery-getMyId
      description: Recovery Phase - Identity verification
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: benchmarks/scenario/simple/medical-consent/getMyId.js
        arguments: {}

    - label: stress-recovery-removeFileFromRecord
      description: Recovery Phase - Remove files from records
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: benchmarks/scenario/simple/medical-consent/removeFileFromRecord.js
        arguments: {}

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          ignore:
            [
              prometheus,
              pushGateway,
              cadvisor,
              grafana,
              node-exporter,
              ca.org1.example.com,
              ca.org2.example.com,
            ]
          include:
            Avg Memory (MB): avg(container_memory_rss{name=~".+"}) by (name)
            Max Memory (MB): max(container_memory_rss{name=~".+"}) by (name)
            CPU (%): avg(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name)
            Max CPU (%): max(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name)
            Network In (MB): avg(rate(container_network_receive_bytes_total{name=~".+"}[1m])) by (name)
            Network Out (MB): avg(rate(container_network_transmit_bytes_total{name=~".+"}[1m])) by (name)
            Disk Read (MB): avg(rate(container_fs_reads_bytes_total{name=~".+"}[1m])) by (name)
            Disk Write (MB): avg(rate(container_fs_writes_bytes_total{name=~".+"}[1m])) by (name)
            Block I/O Read (MB): avg(rate(container_fs_reads_bytes_total{name=~".+"}[1m])) by (name)
            Block I/O Write (MB): avg(rate(container_fs_writes_bytes_total{name=~".+"}[1m])) by (name)
            File Descriptors: avg(container_file_descriptors{name=~".+"}) by (name)
            Threads: avg(container_threads{name=~".+"}) by (name)

observer:
  type: prometheus
  interval: 1
