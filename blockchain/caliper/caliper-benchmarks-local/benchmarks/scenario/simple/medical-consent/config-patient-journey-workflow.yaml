test:
  name: medical-consent-patient-journey-workflow
  description: Complete patient journey workflow simulating full patient-doctor interaction with sequential data dependencies
  workers:
    type: local
    number: 3
  rounds:
    # Phase 1: Initial Setup - Doctor Registration
    - label: doctor-registration
      description: "Phase 1: Register doctor profiles for patient journey"
      txNumber: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmarks/scenario/simple/medical-consent/registerDoctorProfile.js
        arguments:
          workflow: "patient-journey"
          phase: "setup"

    # Phase 2: Patient Record Creation
    - label: patient-record-creation
      description: "Phase 2: Create initial patient records"
      txNumber: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: benchmarks/scenario/simple/medical-consent/createPatientRecord.js
        arguments:
          workflow: "patient-journey"
          phase: "record-creation"
          dependency: "doctor-registration"

    # Phase 3: Medical Record Creation by Doctor
    - label: medical-record-creation
      description: "Phase 3: Doctor creates medical records for patients"
      txNumber: 25
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmarks/scenario/simple/medical-consent/createMedicalRecord.js
        arguments:
          workflow: "patient-journey"
          phase: "medical-records"
          dependency: "patient-record-creation"

    # Phase 4: Consent Granting
    - label: consent-granting
      description: "Phase 4: Patients grant consent to doctors for record access"
      txNumber: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 4
      workload:
        module: benchmarks/scenario/simple/medical-consent/grantConsent.js
        arguments:
          workflow: "patient-journey"
          phase: "consent-grant"
          dependency: "medical-record-creation"

    # Phase 5: Record Access and Updates
    - label: record-access-and-updates
      description: "Phase 5: Doctor accesses and updates patient records"
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: benchmarks/scenario/simple/medical-consent/getRecordById.js
        arguments:
          workflow: "patient-journey"
          phase: "record-access"
          dependency: "consent-granting"

    - label: record-updates
      description: "Phase 5b: Update patient record details"
      txNumber: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: benchmarks/scenario/simple/medical-consent/updateRecordDetails.js
        arguments:
          workflow: "patient-journey"
          phase: "record-updates"
          dependency: "record-access-and-updates"

    # Phase 6: Private Notes Addition
    - label: private-notes-addition
      description: "Phase 6: Add private notes to patient records"
      txNumber: 15
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmarks/scenario/simple/medical-consent/addPrivateNoteToRecord.js
        arguments:
          workflow: "patient-journey"
          phase: "private-notes"
          dependency: "record-updates"

    # Phase 7: Query Operations
    - label: query-operations
      description: "Phase 7: Perform various query operations on records"
      txNumber: 35
      rateControl:
        type: fixed-rate
        opts:
          tps: 6
      workload:
        module: benchmarks/scenario/simple/medical-consent/findAssetsByQuery.js
        arguments:
          workflow: "patient-journey"
          phase: "queries"
          dependency: "private-notes-addition"

    - label: history-queries
      description: "Phase 7b: Query record history"
      txNumber: 25
      rateControl:
        type: fixed-rate
        opts:
          tps: 4
      workload:
        module: benchmarks/scenario/simple/medical-consent/getAssetHistory.js
        arguments:
          workflow: "patient-journey"
          phase: "history-queries"
          dependency: "query-operations"

    # Phase 8: Consent Management
    - label: consent-revocation
      description: "Phase 8: Patients revoke consent from doctors"
      txNumber: 15
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmarks/scenario/simple/medical-consent/revokeConsent.js
        arguments:
          workflow: "patient-journey"
          phase: "consent-revoke"
          dependency: "history-queries"

    # Phase 9: Record Archival
    - label: record-archival
      description: "Phase 9: Archive completed medical records"
      txNumber: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: benchmarks/scenario/simple/medical-consent/archiveMedicalRecord.js
        arguments:
          workflow: "patient-journey"
          phase: "archival"
          dependency: "consent-revocation"

    # Phase 10: Validation and Cleanup
    - label: workflow-validation
      description: "Phase 10: Validate complete patient journey workflow"
      txNumber: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: benchmarks/scenario/simple/medical-consent/assetExistsByQuery.js
        arguments:
          workflow: "patient-journey"
          phase: "validation"
          dependency: "record-archival"
          validate_workflow: true

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          ignore:
            [
              prometheus,
              pushGateway,
              cadvisor,
              grafana,
              node-exporter,
              ca.org1.example.com,
              ca.org2.example.com,
            ]
          include:
            Avg Memory (MB): avg(container_memory_rss{name=~".+"}) by (name)
            CPU (%): avg(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name)
            Network In (MB): avg(rate(container_network_receive_bytes_total{name=~".+"}[1m])) by (name)
            Network Out (MB): avg(rate(container_network_transmit_bytes_total{name=~".+"}[1m])) by (name)
            Workflow Success Rate: avg(caliper_txn_success_rate) by (label)
            Phase Completion Time: avg(caliper_txn_duration) by (label)

observer:
  type: prometheus
  interval: 3

# Workflow validation criteria
validation:
  success_criteria:
    - metric: "transaction_success_rate"
      threshold: 0.95
      description: "95% of transactions must succeed"
    - metric: "phase_completion_rate"
      threshold: 1.0
      description: "All workflow phases must complete"
    - metric: "data_consistency"
      threshold: 1.0
      description: "Data dependencies must be maintained"

  failure_conditions:
    - metric: "transaction_error_rate"
      threshold: 0.1
      description: "Error rate exceeds 10%"
    - metric: "phase_timeout"
      threshold: 300
      description: "Any phase takes longer than 5 minutes"
