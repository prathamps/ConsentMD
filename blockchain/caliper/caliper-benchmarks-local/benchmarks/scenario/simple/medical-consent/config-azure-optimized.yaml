test:
  name: medical-consent-azure-optimized-benchmark
  description: Azure Standard B2ms optimized benchmark (2 vCPUs, 8GB RAM)
  workers:
    type: local
    number: 1 # Single worker for 2 vCPU system
  rounds:
    # Profile Management Functions
    - label: registerDoctorProfile
      description: Register doctor profiles - Azure optimized
      txNumber: 20 # Reduced for Azure VM
      rateControl:
        type: fixed-rate
        opts:
          tps: 2 # Conservative TPS for 2 vCPU
      workload:
        module: benchmarks/scenario/simple/medical-consent/registerDoctorProfile.js
        arguments: {}

    - label: getMyId
      description: Get identity verification - Azure optimized
      txNumber: 15
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: benchmarks/scenario/simple/medical-consent/getMyId.js
        arguments: {}

    # Record Creation Functions
    - label: createPatientRecord
      description: Create patient records - Azure optimized
      txNumber: 25
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmarks/scenario/simple/medical-consent/createPatientRecord.js
        arguments: {}

    - label: createMedicalRecord
      description: Create medical records - Azure optimized
      txNumber: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmarks/scenario/simple/medical-consent/createMedicalRecord.js
        arguments: {}

    # Record Management Functions
    - label: updateRecordDetails
      description: Update record details - Azure optimized
      txNumber: 15
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: benchmarks/scenario/simple/medical-consent/updateRecordDetails.js
        arguments: {}

    # Consent Management Functions
    - label: grantConsent
      description: Grant consent operations - Azure optimized
      txNumber: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmarks/scenario/simple/medical-consent/grantConsent.js
        arguments: {}

    - label: revokeConsent
      description: Revoke consent operations - Azure optimized
      txNumber: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: benchmarks/scenario/simple/medical-consent/revokeConsent.js
        arguments: {}

    # Query Functions (typically faster)
    - label: getRecordById
      description: Get records by ID - Azure optimized
      txNumber: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: benchmarks/scenario/simple/medical-consent/getRecordById.js
        arguments: {}

    - label: findAssetsByQuery
      description: Find assets by query - Azure optimized
      txNumber: 25
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: benchmarks/scenario/simple/medical-consent/findAssetsByQuery.js
        arguments: {}

    - label: assetExistsByQuery
      description: Check asset existence - Azure optimized
      txNumber: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 4
      workload:
        module: benchmarks/scenario/simple/medical-consent/assetExistsByQuery.js
        arguments: {}

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          ignore:
            [
              prometheus,
              pushGateway,
              cadvisor,
              grafana,
              node-exporter,
              ca.org1.example.com,
              ca.org2.example.com,
            ]
          include:
            Avg Memory (MB): avg(container_memory_rss{name=~".+"}) by (name)
            CPU (%): avg(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name)
            Network In (MB): avg(rate(container_network_receive_bytes_total{name=~".+"}[1m])) by (name)
            Network Out (MB): avg(rate(container_network_transmit_bytes_total{name=~".+"}[1m])) by (name)

observer:
  type: prometheus
  interval: 10 # Longer interval to reduce overhead on 2 vCPU system
