test:
  name: medical-consent-doctor-workflow
  description: Doctor-centric workflow with profile management and record operations focusing on doctor role-based sequences
  workers:
    type: local
    number: 4
  rounds:
    # Phase 1: Doctor Profile Management
    - label: doctor-profile-setup
      description: "Phase 1: Doctor profile registration and identity verification"
      txNumber: 15
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: benchmarks/scenario/simple/medical-consent/registerDoctorProfile.js
        arguments:
          workflow: "doctor-workflow"
          phase: "profile-setup"
          role: "doctor"

    - label: doctor-identity-verification
      description: "Phase 1b: Verify doctor identity and permissions"
      txNumber: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: benchmarks/scenario/simple/medical-consent/getMyId.js
        arguments:
          workflow: "doctor-workflow"
          phase: "identity-verification"
          role: "doctor"
          dependency: "doctor-profile-setup"

    # Phase 2: Medical Record Creation and Management
    - label: medical-record-creation
      description: "Phase 2: Doctor creates new medical records"
      txNumber: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 4
      workload:
        module: benchmarks/scenario/simple/medical-consent/createMedicalRecord.js
        arguments:
          workflow: "doctor-workflow"
          phase: "record-creation"
          role: "doctor"
          dependency: "doctor-identity-verification"

    - label: record-details-update
      description: "Phase 2b: Update medical record details"
      txNumber: 25
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: benchmarks/scenario/simple/medical-consent/updateRecordDetails.js
        arguments:
          workflow: "doctor-workflow"
          phase: "record-updates"
          role: "doctor"
          dependency: "medical-record-creation"

    # Phase 3: Patient Record Access and Consent Management
    - label: patient-record-access
      description: "Phase 3: Doctor accesses patient records with proper authorization"
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 6
      workload:
        module: benchmarks/scenario/simple/medical-consent/getRecordById.js
        arguments:
          workflow: "doctor-workflow"
          phase: "record-access"
          role: "doctor"
          dependency: "record-details-update"

    - label: consent-verification
      description: "Phase 3b: Verify consent status for patient records"
      txNumber: 35
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: benchmarks/scenario/simple/medical-consent/assetExistsByQuery.js
        arguments:
          workflow: "doctor-workflow"
          phase: "consent-verification"
          role: "doctor"
          query_type: "consent_status"
          dependency: "patient-record-access"

    # Phase 4: Clinical Documentation
    - label: private-notes-documentation
      description: "Phase 4: Add private clinical notes to patient records"
      txNumber: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmarks/scenario/simple/medical-consent/addPrivateNoteToRecord.js
        arguments:
          workflow: "doctor-workflow"
          phase: "clinical-documentation"
          role: "doctor"
          dependency: "consent-verification"

    # Phase 5: Advanced Query Operations
    - label: patient-search-queries
      description: "Phase 5: Search for patients and records using complex queries"
      txNumber: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 4
      workload:
        module: benchmarks/scenario/simple/medical-consent/findAssetsByQuery.js
        arguments:
          workflow: "doctor-workflow"
          phase: "patient-search"
          role: "doctor"
          query_type: "patient_records"
          dependency: "private-notes-documentation"

    - label: medical-history-review
      description: "Phase 5b: Review patient medical history"
      txNumber: 25
      rateControl:
        type: fixed-rate
        opts:
          tps: 3
      workload:
        module: benchmarks/scenario/simple/medical-consent/getAssetHistory.js
        arguments:
          workflow: "doctor-workflow"
          phase: "history-review"
          role: "doctor"
          dependency: "patient-search-queries"

    # Phase 6: Record Management Operations
    - label: file-management
      description: "Phase 6: Manage files attached to medical records"
      txNumber: 15
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmarks/scenario/simple/medical-consent/removeFileFromRecord.js
        arguments:
          workflow: "doctor-workflow"
          phase: "file-management"
          role: "doctor"
          dependency: "medical-history-review"

    - label: record-archival-management
      description: "Phase 6b: Archive completed medical records"
      txNumber: 12
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: benchmarks/scenario/simple/medical-consent/archiveMedicalRecord.js
        arguments:
          workflow: "doctor-workflow"
          phase: "record-archival"
          role: "doctor"
          dependency: "file-management"

    # Phase 7: Workflow Performance Validation
    - label: doctor-workflow-validation
      description: "Phase 7: Validate doctor workflow performance and completeness"
      txNumber: 20
      rateControl:
        type: fixed-rate
        opts:
          tps: 4
      workload:
        module: benchmarks/scenario/simple/medical-consent/findAssetsByQuery.js
        arguments:
          workflow: "doctor-workflow"
          phase: "workflow-validation"
          role: "doctor"
          query_type: "workflow_validation"
          dependency: "record-archival-management"
          validate_workflow: true

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          ignore:
            [
              prometheus,
              pushGateway,
              cadvisor,
              grafana,
              node-exporter,
              ca.org1.example.com,
              ca.org2.example.com,
            ]
          include:
            Avg Memory (MB): avg(container_memory_rss{name=~".+"}) by (name)
            CPU (%): avg(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name)
            Network In (MB): avg(rate(container_network_receive_bytes_total{name=~".+"}[1m])) by (name)
            Network Out (MB): avg(rate(container_network_transmit_bytes_total{name=~".+"}[1m])) by (name)
            Doctor Operations TPS: avg(caliper_txn_rate) by (label)
            Authorization Success Rate: avg(caliper_txn_success_rate{role="doctor"}) by (label)
            Clinical Workflow Latency: avg(caliper_txn_duration{workflow="doctor-workflow"}) by (phase)

observer:
  type: prometheus
  interval: 4

# Doctor workflow specific validation
validation:
  success_criteria:
    - metric: "doctor_authorization_success_rate"
      threshold: 0.98
      description: "98% of doctor operations must be properly authorized"
    - metric: "clinical_workflow_completion_rate"
      threshold: 0.95
      description: "95% of clinical workflows must complete successfully"
    - metric: "record_access_latency"
      threshold: 2.0
      description: "Record access should complete within 2 seconds"
    - metric: "documentation_consistency"
      threshold: 1.0
      description: "All clinical documentation must maintain consistency"

  performance_targets:
    - phase: "profile-setup"
      target_tps: 3
      max_latency: 1.5
    - phase: "record-creation"
      target_tps: 4
      max_latency: 2.0
    - phase: "record-access"
      target_tps: 6
      max_latency: 1.0
    - phase: "clinical-documentation"
      target_tps: 2
      max_latency: 3.0

  role_specific_metrics:
    doctor:
      - "profile_management_efficiency"
      - "record_creation_rate"
      - "patient_access_authorization_rate"
      - "clinical_documentation_throughput"
