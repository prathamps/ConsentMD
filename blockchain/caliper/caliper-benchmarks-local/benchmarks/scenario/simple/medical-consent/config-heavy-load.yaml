test:
  name: medical-consent-heavy-load-benchmark
  description: Heavy load benchmark for medical consent chaincode with 5-10 workers and 50-100 TPS
  workers:
    type: local
    number: 8
  rounds:
    # Profile Management Functions
    - label: registerDoctorProfile
      description: Register doctor profiles - heavy load
      txNumber: 800
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: benchmarks/scenario/simple/medical-consent/registerDoctorProfile.js
        arguments: {}

    - label: getMyId
      description: Get identity verification - heavy load
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: benchmarks/scenario/simple/medical-consent/getMyId.js
        arguments: {}

    # Record Creation Functions
    - label: createPatientRecord
      description: Create patient records - heavy load
      txNumber: 900
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: benchmarks/scenario/simple/medical-consent/createPatientRecord.js
        arguments: {}

    - label: createMedicalRecord
      description: Create medical records - heavy load
      txNumber: 700
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: benchmarks/scenario/simple/medical-consent/createMedicalRecord.js
        arguments: {}

    # Record Management Functions
    - label: updateRecordDetails
      description: Update record details - heavy load
      txNumber: 600
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: benchmarks/scenario/simple/medical-consent/updateRecordDetails.js
        arguments: {}

    - label: archiveMedicalRecord
      description: Archive medical records - heavy load
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 40
      workload:
        module: benchmarks/scenario/simple/medical-consent/archiveMedicalRecord.js
        arguments: {}

    - label: removeFileFromRecord
      description: Remove files from records - heavy load
      txNumber: 400
      rateControl:
        type: fixed-rate
        opts:
          tps: 35
      workload:
        module: benchmarks/scenario/simple/medical-consent/removeFileFromRecord.js
        arguments: {}

    # Consent Management Functions
    - label: grantConsent
      description: Grant consent operations - heavy load
      txNumber: 650
      rateControl:
        type: fixed-rate
        opts:
          tps: 55
      workload:
        module: benchmarks/scenario/simple/medical-consent/grantConsent.js
        arguments: {}

    - label: revokeConsent
      description: Revoke consent operations - heavy load
      txNumber: 450
      rateControl:
        type: fixed-rate
        opts:
          tps: 40
      workload:
        module: benchmarks/scenario/simple/medical-consent/revokeConsent.js
        arguments: {}

    # Query and Private Data Functions
    - label: getRecordById
      description: Get records by ID - heavy load
      txNumber: 1200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: benchmarks/scenario/simple/medical-consent/getRecordById.js
        arguments: {}

    - label: findAssetsByQuery
      description: Find assets by query - heavy load
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 80
      workload:
        module: benchmarks/scenario/simple/medical-consent/findAssetsByQuery.js
        arguments: {}

    - label: getAssetHistory
      description: Get asset history - heavy load
      txNumber: 800
      rateControl:
        type: fixed-rate
        opts:
          tps: 70
      workload:
        module: benchmarks/scenario/simple/medical-consent/getAssetHistory.js
        arguments: {}

    - label: assetExistsByQuery
      description: Check asset existence - heavy load
      txNumber: 1100
      rateControl:
        type: fixed-rate
        opts:
          tps: 90
      workload:
        module: benchmarks/scenario/simple/medical-consent/assetExistsByQuery.js
        arguments: {}

    - label: addPrivateNoteToRecord
      description: Add private notes to records - heavy load
      txNumber: 550
      rateControl:
        type: fixed-rate
        opts:
          tps: 45
      workload:
        module: benchmarks/scenario/simple/medical-consent/addPrivateNoteToRecord.js
        arguments: {}

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          ignore:
            [
              prometheus,
              pushGateway,
              cadvisor,
              grafana,
              node-exporter,
              ca.org1.example.com,
              ca.org2.example.com,
            ]
          include:
            Avg Memory (MB): avg(container_memory_rss{name=~".+"}) by (name)
            CPU (%): avg(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name)
            Network In (MB): avg(rate(container_network_receive_bytes_total{name=~".+"}[1m])) by (name)
            Network Out (MB): avg(rate(container_network_transmit_bytes_total{name=~".+"}[1m])) by (name)
            Disk Read (MB): avg(rate(container_fs_reads_bytes_total{name=~".+"}[1m])) by (name)
            Disk Write (MB): avg(rate(container_fs_writes_bytes_total{name=~".+"}[1m])) by (name)
            Block I/O Read (MB): avg(rate(container_fs_reads_bytes_total{name=~".+"}[1m])) by (name)
            Block I/O Write (MB): avg(rate(container_fs_writes_bytes_total{name=~".+"}[1m])) by (name)

observer:
  type: prometheus
  interval: 2
