# Mixed workload: 40% grants, 40% consent-checked reads, 20% revocations —
# an approximation of steady clinic traffic. Weights are configurable via
# operationWeights.
test:
  name: Mixed Workload Performance Test
  description: Blended grant/read/revoke operations
  workers:
    number: 2
  rounds:
    - label: mixed-workload-warmup
      description: Short warmup so JIT/gRPC/session caches are hot before measurement
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 15
      workload:
        module: workloads/mixed-workload.js
        arguments: &dataset
          patientCount: 10          # per worker
          doctorCount: 5            # per worker
          recordsPerPatient: 3
          seedConsentRatio: 0.5
          unauthorizedReadRatio: 0.2
          operationWeights:
            grantConsent: 0.4
            recordAccess: 0.4
            revokeConsent: 0.2
    - label: mixed-workload-main
      description: Main mixed workload measurement round
      txDuration: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workloads/mixed-workload.js
        arguments: *dataset

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [dev-.*, peer.*, orderer.*, couchdb.*]
          queries:
            - name: "Avg Memory (MB)"
              query: 'sum(container_memory_rss{name=~".+"}) by (name)'
              step: 10
              label: name
              statistic: avg
            - name: "CPU (%)"
              query: 'sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100'
              step: 10
              label: name
              statistic: avg
