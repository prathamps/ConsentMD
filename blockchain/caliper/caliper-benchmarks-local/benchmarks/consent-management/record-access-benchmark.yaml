# Record-access (read) benchmark.
# 20% of reads are deliberate unauthorized attempts; the chaincode's denial is
# the expected outcome and is recorded as "denied", never as a failure
# (docs/methodology.md, failure definition).
test:
  name: Record Access Performance Test
  description: Consent-checked record reads, authorized and unauthorized
  workers:
    number: 2
  rounds:
    - label: record-access-warmup
      description: Short warmup so JIT/gRPC/session caches are hot before measurement
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/record-access.js
        arguments: &dataset
          patientCount: 10          # per worker
          doctorCount: 5            # per worker
          recordsPerPatient: 3
          seedConsentRatio: 0.7
          unauthorizedReadRatio: 0.2
    - label: record-access-main
      description: Main record access measurement round
      txDuration: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workloads/record-access.js
        arguments: *dataset

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [dev-.*, peer.*, orderer.*, couchdb.*]
          queries:
            - name: "Avg Memory (MB)"
              query: 'sum(container_memory_rss{name=~".+"}) by (name)'
              step: 10
              label: name
              statistic: avg
            - name: "CPU (%)"
              query: 'sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100'
              step: 10
              label: name
              statistic: avg
