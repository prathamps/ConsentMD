# Smallest possible smoke test: verifies identities, chaincode, and workload
# wiring in under a minute. Run this first after provisioning identities.
test:
  name: Minimal Consent Granting Smoke Test
  description: Tiny consent-granting round for setup verification
  workers:
    number: 1
  rounds:
    - label: minimal-consent-granting
      description: Smoke test round
      txNumber: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: workloads/consent-granting.js
        arguments:
          patientCount: 2
          doctorCount: 2
          recordsPerPatient: 1
          seedConsentRatio: 0
