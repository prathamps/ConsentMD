# Consent-granting benchmark.
# Dataset is seeded by the workload itself (see src/fixtures.js) and its exact
# size is written to the run's dataset manifest. Repetitions, latency
# percentiles, and the failure definition are handled by run-benchmarks.sh +
# src/aggregate-results.js (docs/methodology.md).
test:
  name: Consent Granting Performance Test
  description: Consent granting throughput and latency
  workers:
    number: 2
  rounds:
    - label: consent-granting-warmup
      description: Short warmup so JIT/gRPC/session caches are hot before measurement
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workloads/consent-granting.js
        arguments: &dataset
          patientCount: 10          # per worker
          doctorCount: 5            # per worker
          recordsPerPatient: 3
          seedConsentRatio: 0.2     # leave most pairs free to be granted
    - label: consent-granting-main
      description: Main consent granting measurement round
      txDuration: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/consent-granting.js
        arguments: *dataset

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [dev-.*, peer.*, orderer.*, couchdb.*]
          queries:
            # Sampled every 10 s from cAdvisor via Prometheus (reviewer item 15;
            # the host-level docker-stats collector in monitoring/ is the
            # source for the paper's resource figures).
            - name: "Avg Memory (MB)"
              query: 'sum(container_memory_rss{name=~".+"}) by (name)'
              step: 10
              label: name
              statistic: avg
            - name: "CPU (%)"
              query: 'sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100'
              step: 10
              label: name
              statistic: avg
