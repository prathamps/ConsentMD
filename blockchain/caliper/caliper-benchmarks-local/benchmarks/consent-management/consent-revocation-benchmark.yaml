# Consent-revocation benchmark.
# Seeds a high consent ratio so the round revokes real consents; when the
# active pool empties it replenishes with grants, which the aggregator reports
# as a separate operation so revocation latency stays clean.
test:
  name: Consent Revocation Performance Test
  description: Consent revocation throughput and latency
  workers:
    number: 2
  rounds:
    - label: consent-revocation-warmup
      description: Short warmup so JIT/gRPC/session caches are hot before measurement
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: workloads/consent-revocation.js
        arguments: &dataset
          patientCount: 10          # per worker
          doctorCount: 5            # per worker
          recordsPerPatient: 3
          seedConsentRatio: 0.9
    - label: consent-revocation-main
      description: Main consent revocation measurement round
      txDuration: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 25
      workload:
        module: workloads/consent-revocation.js
        arguments: *dataset

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [dev-.*, peer.*, orderer.*, couchdb.*]
          queries:
            - name: "Avg Memory (MB)"
              query: 'sum(container_memory_rss{name=~".+"}) by (name)'
              step: 10
              label: name
              statistic: avg
            - name: "CPU (%)"
              query: 'sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100'
              step: 10
              label: name
              statistic: avg
