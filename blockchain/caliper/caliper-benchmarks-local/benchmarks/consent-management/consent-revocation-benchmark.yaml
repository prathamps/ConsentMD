test:
  name: Consent Revocation Performance Test
  description: 5-minute performance test for consent revocation operations
  workers:
    number: 2
  rounds:
    - label: initialization
      description: Initialize test data (patients, doctors, records)
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/consent-granting.js
        arguments:
          mode: initialization
          patientsPerWorker: 50
          doctorsPerWorker: 20
          recordsPerWorker: 100
    - label: consent-setup
      description: Create consent relationships for revocation testing
      txDuration: 90
      rateControl:
        type: fixed-rate
        opts:
          tps: 40
      workload:
        module: workloads/consent-granting.js
        arguments:
          mode: granting
    - label: revocation-warmup
      description: Warmup phase for consent revocation
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: workloads/consent-revocation.js
    - label: consent-revocation-main
      description: Main consent revocation performance test
      txDuration: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 25
      workload:
        module: workloads/consent-revocation.js
    - label: cleanup
      description: Clean up remaining test data
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: workloads/consent-granting.js
        arguments:
          mode: cleanup

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [dev-.*, test-.*]
          queries:
            - name: "Avg Memory (MB)"
              query: 'sum(container_memory_rss{name=~".+"}) by (name)'
              step: 10
              label: name
              statistic: avg
            - name: "CPU (%)"
              query: 'sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100'
              step: 10
              label: name
              statistic: avg
            - name: "Network Out (MB)"
              query: 'sum(rate(container_network_transmit_bytes_total{name=~".+"}[1m])) by (name) / 1024 / 1024'
              step: 10
              label: name
              statistic: sum
