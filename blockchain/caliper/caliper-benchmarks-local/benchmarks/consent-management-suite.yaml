# Quick all-in-one suite: one short round per operation type.
# Use this to sanity-check a network; use run-benchmarks.sh (10 repetitions +
# aggregation) for numbers you intend to publish.
test:
  name: ConsentMD Performance Benchmark Suite
  description: One short round per consent-management operation
  workers:
    number: 2
  rounds:
    - label: consent-granting
      description: Consent granting
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/consent-granting.js
        arguments: &dataset
          patientCount: 10          # per worker
          doctorCount: 5            # per worker
          recordsPerPatient: 3
          seedConsentRatio: 0.2
    - label: record-access
      description: Consent-checked reads (20% deliberate unauthorized)
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workloads/record-access.js
        arguments:
          <<: *dataset
          seedConsentRatio: 0.7
          unauthorizedReadRatio: 0.2
    - label: consent-revocation
      description: Consent revocation
      txNumber: 150
      rateControl:
        type: fixed-rate
        opts:
          tps: 25
      workload:
        module: workloads/consent-revocation.js
        arguments:
          <<: *dataset
          seedConsentRatio: 0.9
    - label: mixed-workload
      description: 40/40/20 grant/read/revoke blend
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workloads/mixed-workload.js
        arguments:
          <<: *dataset
          seedConsentRatio: 0.5

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [dev-.*, peer.*, orderer.*, couchdb.*]
          queries:
            - name: "Avg Memory (MB)"
              query: 'sum(container_memory_rss{name=~".+"}) by (name)'
              step: 10
              label: name
              statistic: avg
            - name: "CPU (%)"
              query: 'sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100'
              step: 10
              label: name
              statistic: avg
