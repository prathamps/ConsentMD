test:
  name: ConsentMD Performance Benchmark Suite
  description: Comprehensive performance testing for consent management operations
  workers:
    number: 2
  rounds:
    - label: initialization
      description: Initialize test data (patients, doctors, records)
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workloads/consent-granting.js
        arguments:
          mode: initialization
    - label: consent-granting
      description: Benchmark consent granting performance
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workloads/consent-granting.js
        arguments:
          mode: granting
    - label: record-access
      description: Benchmark record access performance
      txNumber: 300
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workloads/record-access.js
    - label: consent-revocation
      description: Benchmark consent revocation performance
      txNumber: 150
      rateControl:
        type: fixed-rate
        opts:
          tps: 25
      workload:
        module: workloads/consent-revocation.js
    - label: mixed-workload
      description: Benchmark mixed operations
      txNumber: 500
      rateControl:
        type: fixed-rate
        opts:
          tps: 75
      workload:
        module: workloads/mixed-workload.js
    - label: cleanup
      description: Clean up test data
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/consent-granting.js
        arguments:
          mode: cleanup

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [dev-.*, test-.*]
          queries:
            - name: "Avg Memory (MB)"
              query: 'sum(container_memory_rss{name=~".+"}) by (name)'
              step: 10
              label: name
              statistic: avg
            - name: "CPU (%)"
              query: 'sum(rate(container_cpu_usage_seconds_total{name=~".+"}[1m])) by (name) * 100'
              step: 10
              label: name
              statistic: avg
            - name: "Network In (MB)"
              query: 'sum(rate(container_network_receive_bytes_total{name=~".+"}[1m])) by (name) / 1024 / 1024'
              step: 10
              label: name
              statistic: sum
            - name: "Network Out (MB)"
              query: 'sum(rate(container_network_transmit_bytes_total{name=~".+"}[1m])) by (name) / 1024 / 1024'
              step: 10
              label: name
              statistic: sum
