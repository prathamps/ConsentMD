name: Blockchain Performance Benchmarks

on:
  # Run on push to main branch
  push:
    branches: [main, develop]
    paths:
      - "ConsentMD/blockchain/**"
      - ".github/workflows/benchmark.yml"

  # Run on pull requests
  pull_request:
    branches: [main]
    paths:
      - "ConsentMD/blockchain/**"

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      benchmark_suite:
        description: "Benchmark suite to run"
        required: true
        default: "ci-light"
        type: choice
        options:
          - ci-light
          - ci-medium
          - ci-heavy
          - ci-workflow
          - ci-full
      fail_fast:
        description: "Fail fast on first error"
        required: false
        default: true
        type: boolean

  # Scheduled runs (daily at 2 AM UTC)
  schedule:
    - cron: "0 2 * * *"

env:
  NODE_VERSION: "18"
  BENCHMARK_TIMEOUT: 30

jobs:
  validate-environment:
    name: Validate Environment
    runs-on: ubuntu-latest
    outputs:
      validation-passed: ${{ steps.validate.outputs.passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ConsentMD/blockchain/caliper/caliper-benchmarks-local/package.json"

      - name: Install dependencies
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local
        run: |
          npm ci
          npm install -g @hyperledger/caliper-cli

      - name: Install execution script dependencies
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local/scripts/execution
        run: npm install

      - name: Validate environment
        id: validate
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local/scripts/execution
        run: |
          if node validateEnvironment.js; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  light-benchmarks:
    name: Light Load Benchmarks
    runs-on: ubuntu-latest
    needs: validate-environment
    if: needs.validate-environment.outputs.validation-passed == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ConsentMD/blockchain/caliper/caliper-benchmarks-local/package.json"

      - name: Install dependencies
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local
        run: |
          npm ci
          npm install -g @hyperledger/caliper-cli

      - name: Install execution script dependencies
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local/scripts/execution
        run: npm install

      - name: Start blockchain network
        working-directory: ConsentMD/blockchain
        run: |
          # Add commands to start your blockchain network
          # docker-compose up -d
          echo "Blockchain network startup would go here"

      - name: Wait for network ready
        run: |
          # Add health checks for your blockchain network
          sleep 30
          echo "Network health check would go here"

      - name: Run light benchmarks
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local/scripts/execution
        run: |
          node ci-benchmark.js ci-light --config ci-config.json

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: light-benchmark-reports
          path: |
            ConsentMD/blockchain/caliper/caliper-benchmarks-local/reports/
            ConsentMD/blockchain/caliper/caliper-benchmarks-local/logs/
          retention-days: 30

      - name: Stop blockchain network
        if: always()
        working-directory: ConsentMD/blockchain
        run: |
          # Add commands to stop your blockchain network
          # docker-compose down
          echo "Blockchain network cleanup would go here"

  medium-benchmarks:
    name: Medium Load Benchmarks
    runs-on: ubuntu-latest
    needs: [validate-environment, light-benchmarks]
    if: needs.validate-environment.outputs.validation-passed == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ConsentMD/blockchain/caliper/caliper-benchmarks-local/package.json"

      - name: Install dependencies
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local
        run: |
          npm ci
          npm install -g @hyperledger/caliper-cli

      - name: Install execution script dependencies
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local/scripts/execution
        run: npm install

      - name: Start blockchain network
        working-directory: ConsentMD/blockchain
        run: |
          # Add commands to start your blockchain network
          echo "Blockchain network startup would go here"

      - name: Wait for network ready
        run: |
          sleep 30
          echo "Network health check would go here"

      - name: Run medium benchmarks
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local/scripts/execution
        run: |
          node ci-benchmark.js ci-medium --config ci-config.json

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medium-benchmark-reports
          path: |
            ConsentMD/blockchain/caliper/caliper-benchmarks-local/reports/
            ConsentMD/blockchain/caliper/caliper-benchmarks-local/logs/
          retention-days: 30

      - name: Stop blockchain network
        if: always()
        working-directory: ConsentMD/blockchain
        run: |
          echo "Blockchain network cleanup would go here"

  workflow-benchmarks:
    name: Workflow Benchmarks
    runs-on: ubuntu-latest
    needs: validate-environment
    if: needs.validate-environment.outputs.validation-passed == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "ConsentMD/blockchain/caliper/caliper-benchmarks-local/package.json"

      - name: Install dependencies
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local
        run: |
          npm ci
          npm install -g @hyperledger/caliper-cli

      - name: Install execution script dependencies
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local/scripts/execution
        run: npm install

      - name: Start blockchain network
        working-directory: ConsentMD/blockchain
        run: |
          echo "Blockchain network startup would go here"

      - name: Wait for network ready
        run: |
          sleep 30
          echo "Network health check would go here"

      - name: Run workflow benchmarks
        working-directory: ConsentMD/blockchain/caliper/caliper-benchmarks-local/scripts/execution
        run: |
          node ci-benchmark.js ci-workflow --config ci-config.json

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-benchmark-reports
          path: |
            ConsentMD/blockchain/caliper/caliper-benchmarks-local/reports/
            ConsentMD/blockchain/caliper/caliper-benchmarks-local/logs/
          retention-days: 30

      - name: Stop blockchain network
        if: always()
        working-directory: ConsentMD/blockchain
        run: |
          echo "Blockchain network cleanup would go here"

  publish-results:
    name: Publish Results
    runs-on: ubuntu-latest
    needs: [light-benchmarks, medium-benchmarks, workflow-benchmarks]
    if: always() && (needs.light-benchmarks.result == 'success' || needs.medium-benchmarks.result == 'success' || needs.workflow-benchmarks.result == 'success')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: benchmark-results

      - name: Combine results
        run: |
          mkdir -p combined-results
          find benchmark-results -name "*.html" -exec cp {} combined-results/ \;
          find benchmark-results -name "*.json" -exec cp {} combined-results/ \;
          find benchmark-results -name "*.log" -exec cp {} combined-results/ \;

      - name: Generate summary report
        run: |
          echo "# Blockchain Performance Benchmark Results" > BENCHMARK_SUMMARY.md
          echo "" >> BENCHMARK_SUMMARY.md
          echo "**Date:** $(date)" >> BENCHMARK_SUMMARY.md
          echo "**Commit:** ${{ github.sha }}" >> BENCHMARK_SUMMARY.md
          echo "**Branch:** ${{ github.ref_name }}" >> BENCHMARK_SUMMARY.md
          echo "" >> BENCHMARK_SUMMARY.md
          echo "## Test Results" >> BENCHMARK_SUMMARY.md
          echo "" >> BENCHMARK_SUMMARY.md

          if [ "${{ needs.light-benchmarks.result }}" == "success" ]; then
            echo "✅ Light Load Benchmarks: PASSED" >> BENCHMARK_SUMMARY.md
          else
            echo "❌ Light Load Benchmarks: FAILED" >> BENCHMARK_SUMMARY.md
          fi

          if [ "${{ needs.medium-benchmarks.result }}" == "success" ]; then
            echo "✅ Medium Load Benchmarks: PASSED" >> BENCHMARK_SUMMARY.md
          elif [ "${{ needs.medium-benchmarks.result }}" == "failure" ]; then
            echo "❌ Medium Load Benchmarks: FAILED" >> BENCHMARK_SUMMARY.md
          else
            echo "⏭️ Medium Load Benchmarks: SKIPPED" >> BENCHMARK_SUMMARY.md
          fi

          if [ "${{ needs.workflow-benchmarks.result }}" == "success" ]; then
            echo "✅ Workflow Benchmarks: PASSED" >> BENCHMARK_SUMMARY.md
          elif [ "${{ needs.workflow-benchmarks.result }}" == "failure" ]; then
            echo "❌ Workflow Benchmarks: FAILED" >> BENCHMARK_SUMMARY.md
          else
            echo "⏭️ Workflow Benchmarks: SKIPPED" >> BENCHMARK_SUMMARY.md
          fi

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: combined-benchmark-results
          path: |
            combined-results/
            BENCHMARK_SUMMARY.md
          retention-days: 90

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('BENCHMARK_SUMMARY.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [light-benchmarks, medium-benchmarks, workflow-benchmarks]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "Benchmark tests failed. Notification would be sent here."
          # Add your notification logic here (Slack, email, etc.)
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"Blockchain benchmark tests failed for commit ${{ github.sha }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
